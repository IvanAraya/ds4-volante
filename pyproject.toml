[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ds4-volante"
dynamic = ["version"]
description = "Usa la inclinación de un DualShock 4 como eje de dirección en Linux"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["evdev>=1.4"]
keywords = ["dualshock", "ps4", "gamepad", "steering", "uinput", "evdev"]
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ds4-volante = "ds4_volante.__main__:main"

[project.urls]
Repository = "https://github.com/IvanAraya/ds4-volante"

[tool.setuptools.dynamic]
version = { attr = "ds4_volante.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
